name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # هەر zip ێک (تەنانەت ناو zip ی تر) دەکاتەوە تا settings.gradle.kts بدۆزێتەوە
      - name: Unpack project
        run: |
          for i in 1 2 3; do
            if [ -z "$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)" ]; then
              find . -name '*.zip' -not -path './.git/*' -print0 | while IFS= read -r -d '' z; do
                unzip -o -q "$z" -d "$(dirname "$z")" || true
              done
            fi
          done
          F=$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)
          if [ -z "$F" ]; then echo "settings.gradle.kts نەدۆزرایەوە"; ls -R | head -50; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$F")" >> "$GITHUB_ENV"
          echo "Project dir: $(dirname "$F")"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Use the recovered original key; never generate a replacement signing identity.
      - name: Restore and verify original signing key
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEY_TMP="$(mktemp)"
          trap 'rm -f "$KEY_TMP"' EXIT
          CANDIDATE="app/debug.keystore"
          if [ -n "$SIGNING_KEY_BASE64" ]; then
            printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$KEY_TMP"
            CANDIDATE="$KEY_TMP"
          elif [ ! -s "$CANDIDATE" ]; then
            echo "::error::Add the original key to the ANDROID_DEBUG_KEYSTORE_BASE64 repository secret."
            exit 1
          fi
          EXPECTED="6ccb72cc9b04d85728bf324e95ec66638dd9adb7c3646d0e43d0c9c01e65bb92"
          ACTUAL="$(keytool -exportcert -keystore "$CANDIDATE" -storepass android -alias androiddebugkey | sha256sum | cut -d ' ' -f1)"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Wrong signing certificate. The APK must use the recovered original key."
            exit 1
          fi
          if [ "$CANDIDATE" = "$KEY_TMP" ]; then
            mv "$KEY_TMP" app/debug.keystore
          fi
          chmod 600 app/debug.keystore
          echo "Original signing certificate verified."

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: MangaTranslator-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/وەڕگێڕی_شاشە.apk
