name: Build Vidora 2.8.1 (Private, Signed, Security Checks)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Require private source repository
        if: ${{ !github.event.repository.private }}
        run: |
          echo '::error::Make the source repository PRIVATE before building. See PRIVATE-REPOSITORY.md.'
          exit 1

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Locate Android project (root or single ZIP)
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t archives < <(find . -maxdepth 1 -type f -iname '*.zip' -print | sort)
          if [[ ${#archives[@]} -gt 1 ]]; then
            echo '::error::Keep exactly one project ZIP, or extract the desired project and remove all ZIPs.'
            exit 1
          elif [[ ${#archives[@]} -eq 1 ]]; then
            mkdir -p extracted
            unzip -q "${archives[0]}" -d extracted
            mapfile -t projects < <(find extracted -maxdepth 5 -type f -name 'settings.gradle.kts' -print | sort)
            if [[ ${#projects[@]} -ne 1 ]]; then
              echo '::error::The ZIP must contain exactly one Android project.'
              exit 1
            fi
            project_dir="$(dirname "${projects[0]}")"
          elif [[ -f settings.gradle.kts && -f app/build.gradle.kts ]]; then
            project_dir='.'
          else
            echo '::error::No Android project or project ZIP found.'
            exit 1
          fi
          test -f "$project_dir/app/build.gradle.kts"
          if [[ ! -f "$project_dir/app/src/main/java/com/kurd/videodownloader/SnapchatSource.kt" ]] || ! grep -q 'SnapchatSource.request' "$project_dir/app/src/main/java/com/kurd/videodownloader/DownloadService.kt"; then
            echo '::error::Snapchat fix missing. Use the 2.8.1 project ZIP, not an older archive.'
            exit 1
          fi
          if [[ ! -f "$project_dir/app/src/main/java/com/kurd/videodownloader/PlaybackDownload.kt" ]] || [[ ! -f "$project_dir/app/src/main/java/com/kurd/videodownloader/NativeFiles.kt" ]]; then
            echo '::error::Player download/file deletion features missing. Use the 2.8.1 project ZIP.'
            exit 1
          fi
          for feature in SecurityGate SecureStore VerifiedEngineUpdater TransportPolicy SnapchatSpotlight SnapchatOriginal DownloadSession MediaCovers StartupScreen ClipSelection MediaClipper LocalCut; do
            test -f "$project_dir/app/src/main/java/com/kurd/videodownloader/$feature.kt" || {
              echo '::error::Security implementation missing. Select the 2.8.1 project ZIP.'
              exit 1
            }
          done
          if ! grep -Fq 'Regex("/[a-z]/' "$project_dir/app/src/main/java/com/kurd/videodownloader/SnapchatOriginal.kt"; then
            echo '::error::Snapchat Discover CDN fix missing. Use the 2.8.1 project ZIP.'
            exit 1
          fi
          test -f "$project_dir/app/src/main/assets/startup/loading.html" || {
            echo '::error::New loading design missing. Use the 2.8.1 project ZIP.'
            exit 1
          }
          test -f "$project_dir/app/src/main/assets/startup/loading.gif"
          for control in videoRepeatBtn screenModeBtn; do
            grep -q "id=\"$control\"" "$project_dir/app/src/main/assets/player/index.html" || {
              echo '::error::Player repeat/fullscreen controls missing. Use the 2.8.1 project ZIP.'
              exit 1
            }
          done
          test -f "$project_dir/app/src/main/assets/ui/clip.js" || { echo '::error::Clip selector missing. Use the 2.8.1 project ZIP.'; exit 1; }
          test -f "$project_dir/app/src/main/assets/player/cut.js" || { echo '::error::Offline Cut missing. Use the 2.8.1 project ZIP.'; exit 1; }
          test -f "$project_dir/tools/security/audit_apk.py"
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
          echo "Android project: $project_dir"
          if ! grep -q 'fun validateSource' "$project_dir/app/src/main/java/com/kurd/videodownloader/MainActivity.kt"; then
            echo '::error::This workflow expects the 2.8.1 safety-enabled project. An older project was selected.'
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk" && test -d "$sdk/platforms/android-35" || {
            echo '::error::Android SDK 35 is not installed on the runner.'
            exit 1
          }

      - name: Restore permanent signing key from encrypted GitHub Secrets
        shell: bash
        env:
          B64: ${{ secrets.VIDORA_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.VIDORA_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VIDORA_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.VIDORA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in B64 STORE_PASS KEY_ALIAS KEY_PASS; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing signing secret: $name. Follow UPDATE-SETUP.md"
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/vidora-stable-release.jks"
          umask 077
          printf '%s' "$B64" | base64 --decode > "$keystore" || {
            echo '::error::Keystore base64 could not be decoded.'
            exit 1
          }
          if [[ ! -s "$keystore" ]]; then
            echo '::error::Decoded keystore is empty.'
            exit 1
          fi
          if ! keytool -list -keystore "$keystore" -storepass "$STORE_PASS" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo '::error::Signing keystore, password, or alias is incorrect.'
            exit 1
          fi
          echo "VIDORA_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"
          echo 'Stable keystore loaded; no secrets printed.'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.9'

      - name: Build SIGNED release APK with increased versionCode
        shell: bash
        env:
          VIDORA_STORE_PASSWORD: ${{ secrets.VIDORA_STORE_PASSWORD }}
          VIDORA_KEY_ALIAS: ${{ secrets.VIDORA_KEY_ALIAS }}
          VIDORA_KEY_PASSWORD: ${{ secrets.VIDORA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export VIDORA_VERSION_CODE="$((100000 + GITHUB_RUN_NUMBER))"
          export VIDORA_VERSION_NAME="2.8.1.${GITHUB_RUN_NUMBER}"
          echo "Building Vidora $VIDORA_VERSION_NAME (versionCode $VIDORA_VERSION_CODE)"
          gradle -p "$PROJECT_DIR" :app:testDebugUnitTest :app:assembleRelease --no-daemon --stacktrace

      - name: Verify signature and prepare installer
        shell: bash
        run: |
          set -euo pipefail
          apk="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          apksigner="$(find "$sdk/build-tools" -mindepth 2 -maxdepth 2 -name apksigner -type f | sort -V | tail -n 1)"
          if [[ -z "$apksigner" ]]; then
            echo '::error::Could not locate apksigner.'
            exit 1
          fi
          "$apksigner" verify --verbose --print-certs "$apk"
          python3 "$PROJECT_DIR/tools/security/test_apk_signer.py"
          python3 "$PROJECT_DIR/tools/security/audit_apk.py" "$apk" --project "$PROJECT_DIR"
          cp "$apk" "$GITHUB_WORKSPACE/Vidora-Update.apk"

      - name: Upload signed, updateable APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Vidora-Update-APK
          path: Vidora-Update.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/vidora-stable-release.jks"
